spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/lago
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      hibernate.show_sql: true
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:55MB}
  task:
    scheduling:
      time-zone: America/Argentina/Cordoba

app:
  defaultCapacity: 30
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  upload:
    dir: ${APP_UPLOAD_DIR:/var/lib/lago-escondido/uploads}
    max-image-size: ${APP_UPLOAD_MAX_IMAGE_SIZE_BYTES:20971520}
    max-document-size: ${APP_UPLOAD_MAX_DOCUMENT_SIZE_BYTES:10485760}
    max-video-size: ${APP_UPLOAD_MAX_VIDEO_SIZE_BYTES:52428800}
  image-processing:
    command: ${APP_IMAGE_PROCESSING_COMMAND:magick}
    timeout-seconds: ${APP_IMAGE_PROCESSING_TIMEOUT_SECONDS:30}
    temp-dir: ${APP_IMAGE_PROCESSING_TEMP_DIR:}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:lagoEscondidoSecretKeyForJWT2025MustBeAtLeast32CharactersLong}
    expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
    admin-phones: ${WHATSAPP_ADMIN_PHONES:}

server:
  port: 8080

# ConfiguraciÃ³n de logging para desarrollo
logging:
  level:
    root: INFO
    com.luismunozse.reservalago: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# ConfiguraciÃ³n de documentaciÃ³n API (habilitada en desarrollo)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /docs
    url: /v3/api-docs

# ConfiguraciÃ³n de gestiÃ³n de endpoints (habilitada en desarrollo)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

# ConfiguraciÃ³n de CORS para desarrollo
cors:
  allowed-origins: http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

